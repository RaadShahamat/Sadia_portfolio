# Publishes the website to GitHub Pages every time you upload changes.
# Step 1 makes the photo list from the /images folders, step 2 publishes.
# In the repository: Settings → Pages → Source: "GitHub Actions".
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the photo list from the images folders
        run: node tools/build-photos.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Package the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
